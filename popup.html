<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Comment & Reels Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <div class="logo" aria-hidden="true">IG</div>
    <div>
      <h1>Comment &amp; Reels Exporter</h1>
      <p class="sub">Instagram → CSV, in your own tab</p>
    </div>
  </header>

  <div class="modebar">
    <label for="modeSel">Export</label>
    <select id="modeSel">
      <option value="comments">Comments of a post or reel</option>
      <option value="reels">Reels of a profile</option>
    </select>
  </div>

  <main class="body">
    <label class="fld">
      <span class="lbl" id="inputLabel">Post or reel URL</span>
      <input id="target" type="text" autocomplete="off" spellcheck="false"
             placeholder="https://www.instagram.com/reel/..." />
      <span class="hint" id="inputHint">Open a post or reel in an Instagram tab where you are logged in.</span>
    </label>

    <label class="fld row" id="countRow">
      <span class="lbl">How many</span>
      <select id="count">
        <option value="100">100</option>
        <option value="500" selected>500</option>
        <option value="1000">1,000</option>
        <option value="5000">5,000</option>
      </select>
    </label>

    <button id="run" class="go">Export &amp; download</button>

    <div id="status" class="status" hidden></div>

    <div id="result" class="result" hidden>
      <p class="ok"><strong id="rowCount">0</strong> <span id="rowNoun">rows</span> exported — CSV downloaded.</p>
      <div class="dl">
        <button id="dlAgain" class="btn">Download CSV again</button>
      </div>
    </div>
  </main>

  <footer class="ft">
    <span id="quota">Runs in your own tab · private to you</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
